unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g base-index 1
set -g mouse on

# Kitty-graphics passthrough so jupynvim inline images survive tmux (>= 3.3)
set -g allow-passthrough on

# Vim movements
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Show C-Space badge in status bar while prefix is active (via gruvbox theme slot)
set -g @tmux-gruvbox-right-status-x "#{?client_prefix,#[fg=#fabd2f]C-Space #[fg=default],}%Y-%m-%d"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'egel/tmux-gruvbox'
# set desired theme options...
set -g @tmux-gruvbox 'dark' # or 'dark256', 'light', 'light256'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
